<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Retro Snake + Polaroid</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <h1 class="title">Retro Snake — Take a Polaroid!</h1>

    <section class="game-area">
      <div class="hud">
        <div>Score: <span id="score">0</span> &nbsp;|&nbsp; High: <span id="high">0</span></div>
        <div id="status">Ready</div>
      </div>

      <canvas id="game-canvas"></canvas>

      <div id="joystick" class="joystick" aria-hidden="true">
        <button data-dir="up" class="joy-btn up" aria-label="Up">▲</button>
        <div class="middle-row">
          <button data-dir="left" class="joy-btn left" aria-label="Left">◀</button>
          <div class="pad-center" aria-hidden="true"></div>
          <button data-dir="right" class="joy-btn right" aria-label="Right">▶</button>
        </div>
        <button data-dir="down" class="joy-btn down" aria-label="Down">▼</button>
      </div>

      <div class="controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="polaroidBtn">Take Polaroid</button>
        <a id="downloadLink" style="display:none">Download</a>
      </div>
      <p class="hint">Use arrow keys or WASD. Press Space to Play/Pause. Press R to reset. Snake bites itself = game over.</p>
    </section>

    <footer class="footer">
      <small>Made with ❤️ — add to your GitHub Pages and link from your profile README.</small>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
